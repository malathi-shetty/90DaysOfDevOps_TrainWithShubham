<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DevOps Live Deployment Dashboard</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0f172a;
  color:white;
}
.container{padding:40px;max-width:1100px;margin:auto;}
.card{background:#111827;padding:20px;border-radius:12px;margin:10px 0;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;}
.value{font-size:18px;font-weight:bold;}
.label{color:#94a3b8;font-size:13px;}
</style>
</head>

<body>

<div class="container">

<h1>🚀 Live DevOps Dashboard</h1>

<div class="grid">

  <div class="card">
    <div class="label">GitHub Actions Build</div>
    <div class="value" id="build-status">Loading...</div>
  </div>

  <div class="card">
    <div class="label">Last Deployment</div>
    <div class="value" id="deploy-time">Loading...</div>
  </div>

  <div class="card">
    <div class="label">Docker Hub Tag</div>
    <div class="value" id="docker-tag">Loading...</div>
  </div>

  <div class="card">
    <div class="label">EC2 Health</div>
    <div class="value" id="ec2-status">Checking...</div>
  </div>

</div>

</div>

<script>
const GITHUB_USER = "shettymalathi113";
const REPO = "github-actions-practice";
const DOCKER_IMAGE = "shettymalathi113/day45-cicd-app";
const EC2_HEALTH_URL = "http://YOUR-EC2-IP:3000/health";

// --------------------
// GitHub Actions Status
// --------------------
async function getGitHubStatus(){
  try{
    const res = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${REPO}/actions/runs?per_page=1`
    );
    const data = await res.json();
    const run = data.workflow_runs?.[0];

    document.getElementById("build-status").innerText =
      run?.conclusion || "unknown";

    document.getElementById("deploy-time").innerText =
      run?.updated_at || "N/A";

  }catch(e){
    document.getElementById("build-status").innerText = "error";
  }
}

// --------------------
// Docker Hub Latest Tag
// --------------------
async function getDockerTag(){
  try{
    const res = await fetch(
      `https://hub.docker.com/v2/repositories/${DOCKER_IMAGE}/tags?page_size=1`
    );
    const data = await res.json();

    document.getElementById("docker-tag").innerText =
      data.results?.[0]?.name || "latest";

  }catch(e){
    document.getElementById("docker-tag").innerText = "error";
  }
}

// --------------------
// EC2 Health Check
// --------------------
async function checkEC2(){
  try{
    const res = await fetch(EC2_HEALTH_URL);
    if(res.ok){
      document.getElementById("ec2-status").innerText = "🟢 Healthy";
    }else{
      document.getElementById("ec2-status").innerText = "🔴 Down";
    }
  }catch(e){
    document.getElementById("ec2-status").innerText = "🔴 Offline";
  }
}

// --------------------
// Auto Refresh Loop
// --------------------
function refreshAll(){
  getGitHubStatus();
  getDockerTag();
  checkEC2();
}

refreshAll();
setInterval(refreshAll, 5000);

</script>

</body>
</html>
